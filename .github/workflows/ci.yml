name: Core clean install
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.16.0', '24.x']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Clean install (no third-party dependencies)
        run: npm ci --ignore-scripts --no-audit --no-fund --offline
      - run: npm test
      - run: npm run demo
      - run: npm run state -- task --input examples/sun-rain/task.json
      - run: npm run state -- update --input examples/sun-rain/update.json
      - run: npm run state -- changes
      - run: npm run scan
